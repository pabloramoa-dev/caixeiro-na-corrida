name: "Piloto NVIDIA Magpie TTS (CPU, sem publicar)"
# Teste isolado disparado por push; nunca publica redes sociais

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/teste-magpie-cpu.yml"

permissions:
  contents: read

concurrency:
  group: piloto-magpie-cpu
  cancel-in-progress: false

jobs:
  testar-vozes:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "4"
      MAGPIE_DEVICE: cpu
    steps:
      - name: Preparar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ make git curl ffmpeg
          mkdir -p saida
      - name: Baixar e compilar Magpie TTS para CPU
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/mudler/magpie-tts.cpp /tmp/magpie-tts.cpp
          cmake -S /tmp/magpie-tts.cpp -B /tmp/magpie-tts.cpp/build -DCMAKE_BUILD_TYPE=Release -DMAGPIE_BUILD_TESTS=OFF
          cmake --build /tmp/magpie-tts.cpp/build -j 4
      - name: Baixar modelo NVIDIA quantizado
        run: |
          curl --fail --location --retry 4 --retry-delay 4 \
            "https://huggingface.co/mudler/magpie-tts.cpp-gguf/resolve/main/magpie-tts-multilingual-357m-q8_0.gguf?download=true" \
            --output /tmp/magpie.gguf
          test "$(stat -c %s /tmp/magpie.gguf)" -gt 500000000
      - name: Gerar dialogo Caixeiro e passageiro em portugues
        run: |
          CLI=/tmp/magpie-tts.cpp/build/examples/cli/magpie-cli
          MODEL=/tmp/magpie.gguf
          "$CLI" say --model "$MODEL" --lang pt-BR --speaker Jason --seed 1234 --threads 4 --text "Boa noite! O senhor entrou no carro carregando uma gaiola vazia. Cadê o passarinho?" --output saida/01_caixeiro.wav
          "$CLI" say --model "$MODEL" --lang pt-BR --speaker Leo --seed 2345 --threads 4 --text "Fugiu no caminho. O curioso é que ele sabia o endereço e chegou em casa antes de mim!" --output saida/02_passageiro.wav
          "$CLI" say --model "$MODEL" --lang pt-BR --speaker Jason --seed 3456 --threads 4 --text "Então hoje quem pediu a corrida foi o dono ou foi o passarinho?" --output saida/03_caixeiro.wav
          "$CLI" say --model "$MODEL" --lang pt-BR --speaker Leo --seed 4567 --threads 4 --text "Foi o passarinho. Eu só estou pagando a viagem!" --output saida/04_passageiro.wav
      - name: Montar dialogo e medir geracao
        if: success()
        run: |
          printf "file '%s'\n" "$(pwd)/saida/01_caixeiro.wav" "$(pwd)/saida/02_passageiro.wav" "$(pwd)/saida/03_caixeiro.wav" "$(pwd)/saida/04_passageiro.wav" > /tmp/lista.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i /tmp/lista.txt -ac 1 -ar 22050 -c:a pcm_s16le saida/dialogo_completo.wav
          ffmpeg -hide_banner -loglevel error -y -i saida/dialogo_completo.wav -c:a libmp3lame -q:a 3 saida/dialogo_completo.mp3
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 saida/dialogo_completo.mp3 | tee saida/metricas.txt
      - name: Salvar audios e relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piloto-nvidia-magpie-caixeiro
          path: saida/
          if-no-files-found: warn
          retention-days: 7
