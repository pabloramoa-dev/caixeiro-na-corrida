name: Vigia da fila

# Todo dia confere se há pelo menos 6 vídeos prontos (2 dias) e quantos roteiros restam.

on:
  schedule:
    - cron: "30 9 * * *"    # 06:30 Brasília
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vigiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - id: f
        run: |
          python -m src.fila --resumo | tail -2 >> $GITHUB_OUTPUT
          python - >> $GITHUB_OUTPUT <<'PY'
          import json
          from src import fila
          from motor.corridas_1min import CATALOGO, ID_INICIAL
          publicados = fila.ids_publicados()
          print(f"restantes={len([e for e in fila.episodios() if e not in publicados])}")
          causos = json.loads(CATALOGO.read_text(encoding='utf-8'))
          faltam = sum(f'cx{ID_INICIAL+i:03d}' not in publicados for i in range(len(causos)))
          print(f"causos_restantes={faltam}")
          PY
      - name: Avisar reserva baixa
        if: steps.f.outputs.reserva_baixa == 'true' || steps.f.outputs.restantes < 30 || steps.f.outputs.causos_restantes < 7
        uses: actions/github-script@v7
        with:
          script: |
            const abertas = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'fila'});
            if (abertas.data.length) return;
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, labels: ['fila'],
              title: 'Caixeiro: ${{ steps.f.outputs.prontos }} vídeo(s), ${{ steps.f.outputs.restantes }} roteiros; ${{ steps.f.outputs.causos_restantes }} causos de humor',
              body: 'Confira Produzir episódios. Se restam menos de 7 causos de 1 minuto, acrescente histórias inéditas a conteudo/corridas_1min.json sem repetir chaves. Não reutilize episódios publicados.'});
