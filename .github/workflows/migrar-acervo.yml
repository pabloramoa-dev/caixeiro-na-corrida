name: Arquivar mídia existente em Releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrar-acervo.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: caixeiro-migracao
  cancel-in-progress: false
jobs:
  arquivar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python motor/release_media.py --migrar
          git config user.name caixeiro-bot
          git config user.email actions@github.com
          git add -A conteudo/ reels/ previews/
          git diff --cached --quiet && exit 0
          git commit -m "Arquivar cópias verificadas em Releases"
          git pull --rebase origin main && git push origin main
        env:
          GH_TOKEN: ${{ github.token }}
