name: Caixeiro — 12h Corrida de 1 Minuto / 20h longo

# 12h: um causo leve e engraçado de 45-75s; 20h: história de ~3 min (Brasília).
# Cada horário abastece sua própria fila, sem reciclar vídeos e sem duplicações.
# Disparo manual permite escolher o formato.

on:
  schedule:
    - cron: "0 15 * * *"   # 12:00 em Brasília (UTC-3)
    - cron: "0 23 * * *"   # 20:00 em Brasília (UTC-3)
  workflow_dispatch:
    inputs:
      horario:
        description: "Qual Reel publicar"
        type: choice
        options: [almoco, noite]
        default: almoco
      dry_run:
        description: "Ensaio: valida tudo e NÃO publica nem manda Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: caixeiro-diario
  cancel-in-progress: false

jobs:
  estoque:
    runs-on: ubuntu-latest
    outputs:
      precisa: ${{ steps.e.outputs.precisa }}
      horario: ${{ steps.e.outputs.horario }}
      formato: ${{ steps.e.outputs.formato }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abastecer causos originais do almoço sem repetir histórias
        if: ${{ (inputs.horario == 'almoco') || (github.event_name == 'schedule' && github.event.schedule == '0 15 * * *') }}
        run: |
          python -m motor.corridas_1min --minimo 3
          git config user.name "caixeiro-bot"
          git config user.email "actions@github.com"
          git add episodios/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "conteúdo: repor Corrida de 1 Minuto [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin main && exit 0; sleep 6; done
          exit 1
      - id: e
        run: |
          python - <<'PY'
          import os
          from src import fila
          horario = "${{ inputs.horario || '' }}" or ("almoco" if "${{ github.event.schedule }}" == "0 15 * * *" else "noite")
          formato = "corrida_1min" if horario == "almoco" else "longo"
          prox = fila.proximo(horario)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"horario={horario}\nformato={formato}\n")
          print("Série:", formato, "| Próximo pronto:", prox)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"precisa={'true' if prox is None else 'false'}\n")
          PY

  render_antes:
    needs: estoque
    if: needs.estoque.outputs.precisa == 'true'
    uses: ./.github/workflows/produzir.yml
    with:
      limite: "1"
      alvo: "1"
      formato: ${{ needs.estoque.outputs.formato }}
    secrets: inherit

  publicar:
    needs: [estoque, render_antes]
    if: ${{ always() && needs.estoque.result == 'success' && (needs.render_antes.result == 'success' || needs.render_antes.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Publicar no Instagram e mandar no Telegram
        env:
          IG_USER_ID_CAIXEIRO: ${{ secrets.IG_USER_ID_CAIXEIRO }}
          IG_ACCESS_TOKEN_CAIXEIRO: ${{ secrets.IG_ACCESS_TOKEN_CAIXEIRO }}
          TELEGRAM_BOT_TOKEN_NINA: ${{ secrets.TELEGRAM_BOT_TOKEN_NINA }}
          TELEGRAM_CHAT_ID_NINA: ${{ secrets.TELEGRAM_CHAT_ID_NINA }}
          RAW_BASE_URL: ${{ vars.RAW_BASE_URL }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          PUBLICAR_ATIVO: "true"
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python -m src.publicar --horario ${{ needs.estoque.outputs.horario }}
      - name: Registrar no histórico
        if: always()
        run: |
          git config user.name "caixeiro-bot"
          git config user.email "actions@github.com"
          git add conteudo/publicados.json
          git diff --cached --quiet && exit 0
          git commit -m "publicado: ${{ needs.estoque.outputs.horario }} [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin main && exit 0; sleep 6; done
          exit 1

  repor:
    needs: [estoque, publicar]
    if: ${{ always() && needs.publicar.result == 'success' }}
    uses: ./.github/workflows/produzir.yml
    with:
      limite: "1"
      alvo: "2"
      formato: ${{ needs.estoque.outputs.formato }}
    secrets: inherit
